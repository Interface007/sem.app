name: Android

# Pull requests build the APK with the debug key (the release key never
# reaches PR builds). Tags v* build with the release key and publish the APK
# as a GitHub release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - apps/mobile/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      EXPO_PUBLIC_SERVER_URL: ${{ vars.SEM_SERVER_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sem/contracts build

      - name: Version
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            code=1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Version $version, versionCode $code"

      - name: Prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Release key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        # arm64 only: every current Android phone; saves three native builds.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Check signature
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if [[ "$IS_RELEASE" == "true" ]] && grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "Release APK is signed with the debug key" >&2
            exit 1
          fi
          mkdir -p dist-apk
          cp "$apk" "dist-apk/sem-${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist-apk/*.apk
          retention-days: 14

      - name: GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-apk/*.apk --title "$GITHUB_REF_NAME" --generate-notes
