name: Android

# Pull requests build the APK with the debug key (the release key never
# reaches PR builds), but only when native configuration changes; JS-only
# changes are covered by ci.yml. Pushes to main that touch the app create the
# next patch release automatically; manually pushed tags v* build that exact
# version. Both publish the APK as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Path filters are not evaluated for tag pushes.
    paths:
      - apps/mobile/**
      - packages/contracts/**
      - pnpm-lock.yaml
  pull_request:
    paths:
      - apps/mobile/app.json
      - apps/mobile/app.config.ts
      - apps/mobile/plugins/**
      - apps/mobile/package.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/android.yml
  workflow_dispatch:

# All releases (main and tags) share one queue, so two quick merges cannot
# compute the same version. Pull requests cancel their own outdated runs.
concurrency:
  group: ${{ github.event_name == 'push' && 'android-release' || format('android-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ github.event_name == 'push' }}
      EXPO_PUBLIC_SERVER_URL: ${{ vars.SEM_SERVER_URL }}
      CCACHE_DIR: ${{ github.workspace }}/../.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
      CCACHE_MAXSIZE: 2G
      GRADLE_BUILD_CACHE_DIR: ${{ github.workspace }}/../.gradle-build-cache
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sem/contracts build

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$IS_RELEASE" == "true" ]]; then
            # Read tags only now: the concurrency queue guarantees that the
            # previous release has already created its tag.
            latest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            latest="${latest:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v${major}.${minor}.$(( patch + 1 ))"
            echo "Latest tag ${latest}, next ${tag}"
          fi
          if [[ "$IS_RELEASE" == "true" ]]; then
            version="${tag#v}"
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Tag $tag is not vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if (( BASH_REMATCH[2] > 999 || BASH_REMATCH[3] > 999 )); then
              echo "Minor and patch must stay below 1000 for the versionCode" >&2
              exit 1
            fi
            code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            code=1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Version $version, versionCode $code"

      - name: Prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Release key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Native (CMake) tasks are not cacheable by Gradle, so ccache covers
      # them. Caches are saved per run and restored from the newest one;
      # main and tags never see caches written by pull requests.
      - name: Restore build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: android-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: android-build-

      - name: Set up ccache and Gradle build cache
        run: |
          if ! command -v ccache > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends ccache
          fi
          ccache --zero-stats
          # The android/ folder is regenerated by prebuild, so the build cache
          # directory is set by an init script instead of gradle.properties.
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/build-cache.gradle <<'EOF'
          gradle.settingsEvaluated { settings ->
              settings.buildCache {
                  local {
                      directory = new File(System.getenv('GRADLE_BUILD_CACHE_DIR'))
                  }
              }
          }
          EOF

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # arm64 only: every current Android phone; saves three native builds.
        # The configuration cache stays inside the run: it would store the
        # signing secrets, and versionName changes every run anyway.
        run: >-
          ./gradlew assembleRelease --no-daemon
          --build-cache --configuration-cache --configuration-cache-problems=warn
          -PreactNativeArchitectures=arm64-v8a

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save build caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.GRADLE_BUILD_CACHE_DIR }}
          key: android-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check signature
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if [[ "$IS_RELEASE" == "true" ]] && grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "Release APK is signed with the debug key" >&2
            exit 1
          fi
          mkdir -p dist-apk
          cp "$apk" "dist-apk/sem-${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist-apk/*.apk
          retention-days: 14

      - name: GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # For main pushes this also creates the tag on the built commit. Tags
        # created with GITHUB_TOKEN do not trigger this workflow again.
        run: >-
          gh release create "$RELEASE_TAG" dist-apk/*.apk
          --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
