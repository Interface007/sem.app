# sem-server auf der Synology DS225+ (Container Manager → Projekt).
# Anleitung: docs/betrieb-nas.md
services:
  sem-server:
    image: ghcr.io/interface007/sem-server:latest
    container_name: sem-server
    restart: unless-stopped
    ports:
      # links: Port auf der NAS (frei wählbar), rechts: Port im Container
      - '8085:8080'
    environment:
      LOG_LEVEL: info
      # Sitzungen (SQLite-Datei sem.db) liegen im Volume /data.
      DATA_DIR: /data
      # Hinter dem DSM-Reverse-Proxy zählt X-Forwarded-Proto (Cookie „Secure“).
      TRUST_PROXY: 'true'
      # Tage ohne Nutzung bis eine Sitzung abläuft (Vorgabe 30):
      # SESSION_TTL_DAYS: 30
      # Anmeldung am DSM (siehe docs/betrieb-nas.md, „Anmeldung am DSM“):
      # NAS_GATEWAY: dsm
      # DSM_URL: http://172.17.0.1:5000
      # Haus-Viewer aus Home Assistant durchreichen (siehe docs/betrieb-nas.md).
      # Der Container muss die Adresse erreichen; im Zweifel die LAN-Adresse nehmen:
      # HAUS_VIEWER_BASE_URL: http://192.168.1.20:8123/local/haus/
      # HAUS_VIEWER_ENTRY: viewer.html
      # Nur für Tests/Entwicklung, nicht im Betrieb:
      # NAS_GATEWAY: local
      # LOCAL_USERS: anna:passwort,ben:passwort2
    volumes:
      # Der Ordner muss für UID 1000 (Benutzer „node“) beschreibbar sein.
      - ./data:/data
    # Härtung: Außer /data braucht der Server keine Schreibrechte.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
